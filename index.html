<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pc.starsbit.space</title>
<meta name="description" content="Projects by starsbit. Work in progress.">
<meta name="theme-color" content="#14110f">
<style>
  :root { --paper: #f3ecdf; --seal: #c23a2b; --ink: #14110f; --muted: #a89f92;
          --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 24px; background: var(--ink); color: var(--paper);
         font-family: var(--serif); text-align: center; }
  main { max-width: 32rem; }
  .seal { display: inline-block; width: 12px; height: 12px; border-radius: 2px; background: var(--seal);
          margin-bottom: 1.5rem; animation: pulse 2.4s ease-in-out infinite; }
  h1 { font-weight: normal; font-size: clamp(1.8rem, 6vw, 2.6rem); margin: 0 0 .75rem; letter-spacing: .01em; }
  p { color: var(--muted); font-size: 1.1rem; line-height: 1.6; margin: 0 0 1.5rem; }
  a { color: var(--paper); text-underline-offset: 3px; }
  a:hover { color: var(--seal); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .seal { animation: none; } }
</style>
</head>
<body>
<main>
  <span class="seal" aria-hidden="true"></span>
  <h1>Work in progress</h1>
  <p>A list of my projects will be here soon.</p>
  <p><a href="https://starsbit.space/">starsbit.space</a></p>
</main>
</body>
</html>
